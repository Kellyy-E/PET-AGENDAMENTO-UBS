<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendimentos — UBS Central</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div id="app"></div>

<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
mountShell({ active: "atendimentos", title: "Central de Atendimentos" });

const PAGE_SIZE = 5;
let visibleCount = PAGE_SIZE;

const today = new Date();
const dateFmt = new Intl.DateTimeFormat("pt-BR", { weekday: "long", day: "2-digit", month: "long", year: "numeric" }).format(today);

function statusBadge(status) {
  const map = {
    aguardando: ["AGUARDANDO", "badge-waiting"],
    em_atendimento: ["EM ATENDIMENTO", "badge-progress"],
    finalizado: ["FINALIZADO", "badge-done"],
  };
  const [label, cls] = map[status] || [status, "badge-waiting"];
  return `<span class="badge ${cls}">${label}</span>`;
}

function actionIcon(a) {
  // Se estiver finalizado, mostra apenas o ícone de visualizar ficha
  if (a.status === "finalizado") {
    return `<button class="icon-btn approve" title="Ficha de atendimento" onclick="UI.toast('Ficha de atendimento gerada (simulação).')">${ICONS.solicitacoes}</button>`;
  }

  // Constrói as opções com base no status (AGUARDANDO vs EM ATENDIMENTO)
  let opcoesHtml = '';
  if (a.status === 'aguardando') {
      opcoesHtml += `<button onclick="abrirModalDigital('${a.id}')">Iniciar</button>`;
  }
  
  opcoesHtml += `
      <button onclick="window.location.href = 'ficha-atendimento.html?id=${a.id}&tab=agendada';">Editar Ficha</button>
      <button onclick="finalizarDireto('${a.id}')">Finalizar</button>
  `;

  return `
      <div class="acoes-container">
          <button class="btn-acoes" onclick="toggleDropdown('${a.id}', event)">+</button>
          <div id="dropdown-${a.id}" class="dropdown-menu">
              ${opcoesHtml}
          </div>
      </div>
  `;
}

function render() {
  const all = Store.getAtendimentos();
  const list = all.slice(0, visibleCount);

const rows = list.length ? list.map(a => `
    <tr>
      <!-- Colocamos a classe numa div DENTRO do td -->
      <td><div class="cell-icon-label">${ICONS.agendas} ${a.tipo}</div></td>
      
      <td>${UI.escapeHtml(a.paciente)}</td>
      <td>${a.turno}</td>
      <td>${statusBadge(a.status)}</td>
      
      <!-- Criamos um container flexível para alinhar os botões de ação perfeitamente -->
      <td>
        <div style="display: flex; align-items: center; gap: 8px;">
            <button class="icon-btn approve" title="Visualizar" onclick="UI.toast('Detalhes do atendimento em construção.')">${ICONS.eye}</button>
            ${actionIcon(a)}
        </div>
      </td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty-cell">Nenhum atendimento agendado.</td></tr>`;

const remaining = all.length - list.length;

  document.getElementById("content").innerHTML = `
    <div class="page-head">
      <div>
        <h2>Atendimentos Agendados do Dia</h2>
        <p style="text-transform:capitalize;">${dateFmt}</p>
      </div>
      <button class="btn btn-primary" onclick="openEspontaneo()">Ficha Atendimento Espontâneo</button>
    </div>

    <div class="card table-card">
      <table>
        <thead><tr><th>Tipo de Consulta</th><th>Paciente</th><th>Turno</th><th>Status</th><th>Ações</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      ${remaining > 0 ? `
        <div class="pending-footer" style="cursor:pointer;border-radius:0;" onclick="loadMore()">Carregar mais ${remaining} agendamentos</div>
      ` : ""}
    </div>
  `;
}

let pacienteAtualValidacao = null;

function toggleDropdown(id, event) {
    if(event) event.stopPropagation(); // Evita que o clique feche imediatamente
    // Fecha outros menus que estejam abertos
    document.querySelectorAll('.dropdown-menu').forEach(menu => {
        if(menu.id !== `dropdown-${id}`) menu.classList.remove('show');
    });
    const dropdown = document.getElementById(`dropdown-${id}`);
    if (dropdown) dropdown.classList.toggle('show');
}

function fecharDropdown(id, event) {
    if(event) event.stopPropagation();
    const dropdown = document.getElementById(`dropdown-${id}`);
    if (dropdown) dropdown.classList.remove('show');
}

function finalizarDireto(id) {
    fecharDropdown(id);
    Store.atualizarStatusAtendimento(id, 'finalizado');
    UI.toast("Atendimento finalizado.");
    render();
}

function abrirModalDigital(id) {
    pacienteAtualValidacao = id;
    fecharDropdown(id);
    // Para centralizar o modal, assumimos que a classe .modal-overlay tem display: flex; quando visível
    document.getElementById('modal-digital').style.display = 'flex';
}

function fecharModalDigital() {
    document.getElementById('modal-digital').style.display = 'none';
    pacienteAtualValidacao = null;
}

// Evento de clique para validar a digital (Botão Finalizado dentro do Modal)
// Garante que o evento só é adicionado quando o DOM carrega
document.addEventListener("DOMContentLoaded", () => {
    document.getElementById('btn-confirmar-digital').addEventListener('click', function() {
        if (pacienteAtualValidacao) {
            // Usa a nova função criada no store.js
            Store.atualizarStatusAtendimento(pacienteAtualValidacao, 'em_atendimento');
            UI.toast(`Validação concluída. Paciente em atendimento.`);
            fecharModalDigital();
            render(); // Atualiza a tabela na tela
        }
    });
});

function loadMore() {
  visibleCount += PAGE_SIZE;
  render();
}

function openEspontaneo() {
  // Redireciona para a página da ficha com a aba de Atendimento Espontâneo pré-selecionada
  window.location.href = "ficha-atendimento.html?tab=espontaneo";
}

render();

</script>
<!-- Modal Validação de Digital (Posição Correta) -->
<div id="modal-digital" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9999;">
    <div class="modal-content digital-modal-content" style="background: #fff; border-radius: 8px; width: 100%; max-width: 400px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
        <div class="modal-header" style="background-color: #004d80; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0; font-size: 18px;">Validação por Digital</h2>
            <span class="close-modal" style="font-size: 24px; cursor: pointer; line-height: 1;" onclick="fecharModalDigital()">&times;</span>
        </div>
        <div class="modal-body text-center" style="padding: 30px 20px;">
            <div class="digital-sensor" style="display: flex; justify-content: center; margin-bottom: 20px;">
                <div class="sensor-circle" style="width: 140px; height: 180px; border: 3px solid #007a5e; border-radius: 50%;"></div>
            </div>
            <p style="margin-bottom: 20px; color: #424752;">Posicione a digital do paciente no sensor.</p>
            <button id="btn-confirmar-digital" class="btn btn-primary" style="width: 100%; justify-content: center;">Finalizado</button>
        </div>
    </div>
</div>

</body>
</html>
