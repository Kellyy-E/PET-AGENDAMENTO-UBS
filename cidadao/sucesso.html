<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solicitação enviada — UBS Digital</title>
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app"></div>
<script src="js/app.js"></script>
<script>
mountApp({ active: "consultas", tools: "none", nav: false });
const c = Store.get().consultas.find(x => x.id === new URLSearchParams(location.search).get("id"));
const protocolo = c ? "UBS-" + D.parse(c.iso).getFullYear() + "-" + c.id.replace(/\D/g, "").slice(-5).padStart(5, "0") : "—";
$("c").innerHTML = `
  <div class="ok">
    <div class="ck">${I.check.replace(/width="20" height="20"/, 'width="38" height="38"')}</div>
    <h2 class="t">Solicitação enviada!</h2>
    <p class="sub">Sua solicitação está <b>em análise</b> pela equipe da UBS. Você será avisado assim que for confirmada.</p>
    ${c ? `<div class="card" style="text-align:left">
      <div class="kv"><span>Protocolo</span><b>${protocolo}</b></div>
      <div class="kv"><span>Especialidade</span><b>${UI.esc(c.esp)}</b></div>
      <div class="kv"><span>Paciente</span><b>${UI.esc(c.paciente)}</b></div>
      <div class="kv"><span>Data</span><b>${D.curto(c.iso)} às ${c.hora}</b></div></div>` : ""}
    <a class="btn p w" href="consultas.html">Ver minhas consultas</a>
    <a class="btn w" href="home.html">Voltar ao início</a>
  </div>`;
</script>
</body>
</html>
