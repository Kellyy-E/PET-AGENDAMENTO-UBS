<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Início — UBS Digital</title>
<link rel="stylesheet" href="css/mobile.css">
</head>
<body>
<div id="app"></div>
<script src="js/app.js"></script>
<script>
mountApp({ active: "home", tools: "full" });
const user = Store.get().user, prox = Store.proximas()[0];

$("c").innerHTML = `
  <h2 class="t">Olá, ${UI.esc(user.nome)}</h2>
  <p class="sub">Como podemos ajudar com sua saúde hoje?</p>
  <h3 style="margin-top:0">Especialidades</h3>
  <div class="grid2">${ESP.map(e => `
    <a class="card esp" href="agendamento.html?esp=${encodeURIComponent(e.nome)}">
      <span class="ib ${e.cor}">${I[e.ic]}</span>${e.nome}
    </a>`).join("")}</div>
  <div class="row"><h3>Próximas Consultas</h3><a href="consultas.html">Ver todas</a></div>
  ${prox ? `
  <div class="card next">
    <div class="dt"><small>${D.mes[D.parse(prox.iso).getMonth()].slice(0, 3).toUpperCase()}</small><b>${D.parse(prox.iso).getDate()}</b>${D.dia[D.parse(prox.iso).getDay()]}</div>
    <div class="bd">
      <div class="row"><span class="pill">${UI.esc(prox.esp)}</span><span class="mt">${I.clock.replace(/width="20" height="20"/, 'width="13" height="13"')}${prox.hora}</span></div>
      <div class="dr">${UI.esc(prox.medico)}</div>
      <div class="mt">${I.pin.replace(/width="20" height="20"/, 'width="13" height="13"')}${prox.unidade} - ${prox.local}</div>
      <a class="btn s w" style="margin-top:12px" href="consultas.html?id=${prox.id}">Detalhes</a>
    </div>
  </div>` : `<div class="card empty">Você não tem consultas agendadas.</div>`}
  <div class="banner">
    <b>Retorno Pendente <span class="pill" style="background:#fff;color:var(--p);margin-left:4px">Clínica Geral</span></b>
    Você tem um retorno pendente para consulta de Clínica Geral, solicite o agendamento o quanto antes.
    <br><a class="btn" href="agendamento.html?esp=${encodeURIComponent("Clínica Geral")}">Solicitar Agendamento</a>
  </div>`;
</script>
</body>
</html>
